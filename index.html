<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market as Music</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <h1>Market as Music</h1>
  <main>
    <p id="status" role="status">Loading…</p>
    <label for="day">Trading day</label>
    <select id="day" disabled></select>
    <fieldset id="controls" disabled>
      <legend>Playback</legend>
      <button id="play" type="button">Play</button>
      <label for="speed">Speed</label>
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1">1× (120 BPM)</option>
        <option value="1.625" selected>1.625× (2-minute day)</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
      <label for="seek">Session time (New York)</label>
      <input id="seek" type="range" min="0" max="389" step="1" value="0">
      <output id="time" for="seek">09:30</output>
    </fieldset>
    <figure id="chart" hidden>
      <svg viewBox="0 0 780 310" role="img" aria-labelledby="chart-title chart-description">
        <title id="chart-title">Session close price</title>
        <desc id="chart-description" data-visual="description">Price revealed with playback.</desc>
        <defs>
          <clipPath id="price-reveal"><rect data-visual="reveal" x="60" y="20" width="0" height="250" /></clipPath>
        </defs>
        <rect data-visual="background" x="60" y="24" width="690" height="240" />
        <rect data-visual="flash" class="event-flash" x="60" y="24" width="690" height="240" opacity="0" />
        <path data-visual="line" clip-path="url(#price-reveal)" fill="none" stroke="#c9e4ff" stroke-width="2" />
        <line data-visual="cursor" y1="24" y2="264" stroke="#bbc4d4" stroke-dasharray="4 4" />
        <circle data-visual="point" r="4" fill="#fff" />
        <g class="chart-labels">
          <text data-visual="high" x="52" y="30" text-anchor="end"></text>
          <text data-visual="low" x="52" y="264" text-anchor="end"></text>
          <text x="60" y="292">09:30</text>
          <text x="405" y="292" text-anchor="middle">12:45</text>
          <text x="750" y="292" text-anchor="end">16:00</text>
        </g>
      </svg>
      <figcaption>Close price · New York time · USD</figcaption>
    </figure>
  </main>
  <footer>
    <p>Data from the HF Data Library (Elkassabgi 2026), <a href="https://hfdatalibrary.com">https://hfdatalibrary.com</a>, CC BY 4.0.</p>
    <p>Data provided for free by IEX. By accessing or using IEX Historical Data, you agree to the <a href="https://www.iex.io/legal/hist-data-terms">IEX Historical Data Terms of Use</a>.</p>
  </footer>
  <script type="module" src="src/main.js"></script>
</body>
</html>
